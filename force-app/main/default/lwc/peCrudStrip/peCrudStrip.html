<template>
    <div class="strip" role="group" aria-label="Object permissions">
        <template for:each={tiles} for:item="t">
            <div key={t.key} class={t.tileClass}>
                <span class="tlabel">{t.label}</span>
                <span class="tstate">
                    <span class={t.dotClass} aria-hidden="true"></span>
                    <span class={t.textClass}>{t.text}</span>
                </span>
            </div>
        </template>
    </div>
</template>
