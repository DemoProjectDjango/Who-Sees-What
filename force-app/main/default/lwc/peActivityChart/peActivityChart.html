<template>
    <template lwc:if={hasData}>
        <div class="chart">
            <div class="plot">
                <template for:each={columns} for:item="col">
                    <div key={col.key} class={col.columnClass} data-key={col.key}
                         onmouseenter={handleEnter} onmouseleave={handleLeave}
                         onfocusin={handleEnter} onfocusout={handleLeave}>

                        <template lwc:if={col.showCard}>
                            <div class="card">
                                <span class="card_figure">{col.totalDisplay}</span>
                                <span class="card_label">{col.fullLabel}</span>
                            </div>
                        </template>

                        <div class="col_track">
                            <!-- code-analyzer-suppress(pmd:AvoidInlineStyles) Column height is one day's volume against the busiest day in the window. The value is computed and clamped in JavaScript; no class can carry it. -->
                            <div class={col.barClass} style={col.barStyle}
                                 tabindex="0" role="img" aria-label={col.title}></div>
                        </div>
                        <span class="col_label">{col.label}</span>
                    </div>
                </template>
            </div>
        </div>
    </template>
</template>
