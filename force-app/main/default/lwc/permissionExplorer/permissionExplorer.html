<template>
  <div class="explorer">
    <header class="topbar">
      <div class="brand">
        <div class="brand_icon_box" aria-hidden="true">
          <img src={projectLogo} alt="Who Sees What Logo" class="brand_logo_img" />
        </div>
        <div class="brand_titles">
          <h1 class="wordmark">Who Sees What</h1>
          <span class="producttag">Access Explorer</span>
        </div>
      </div>

      <div class="title">
        <nav class="crumbs" aria-label="Current selection">
          <template lwc:if={crumbs.length}>
            <template for:each={crumbs} for:item="c">
              <span key={c.key} class="crumb">
                <template lwc:if={c.separator}>
                  <span class="sep" aria-hidden="true">&rsaquo;</span>
                </template>
                {c.label}
              </span>
            </template>
          </template>
          <template lwc:else>
            <span class="crumb crumb_placeholder">Select a user to begin</span>
          </template>
        </nav>
      </div>

      <div class="trust" aria-label="Tool guarantees">
        <span class="pill pill_live">
          <span class="pill_dot" aria-hidden="true"></span>Read only
        </span>
        <span class="pill">
          <span class="pill_dot pill_dot_neutral" aria-hidden="true"></span>Inspection logged
        </span>
      </div>

      <div class="actions">
        <template lwc:if={selectedUserId}>
          <button
            class="slds-button slds-button_brand btn btn_primary"
            type="button"
            onclick={handleCopyLink}
          >
            {copyLabel}
          </button>
        </template>
        <button class="slds-button slds-button_neutral btn" type="button" onclick={handleRefresh}>
          Refresh data
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- 28% navigation rail with ample room for dropdowns, search, filters & lists -->
      <aside class="navigator" aria-label="Access path">
        <!-- Stage 1: Who -->
        <section class={whoSectionClass}>
          <header class={whoHeadClass} onclick={handleStageToggle} onkeydown={handleStageKeyDown} data-stage="who" role="button" aria-expanded={whoOpenStr} tabindex="0" title={whoToggleTitle}>
            <span class={whoBadgeClass} aria-hidden="true">
              <template lwc:if={isWhoDone}>
                <svg viewBox="0 0 24 24" class="check_icon" fill="none" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </template>
              <template lwc:else>1</template>
            </span>
            <div class="nav_heading">
              <span class="nav_title">Who</span>
              <span class="nav_summary" title={whoSummary}>{whoSummary}</span>
            </div>
            <div class="stage_dropdown_btn" title={whoToggleTitle} aria-label={whoToggleTitle}>
              <svg class={whoChevronClass} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </header>
          <template lwc:if={whoOpen}>
            <div class="nav_section_body">
              <c-pe-user-column
                selected-user-id={selectedUserId}
                onuserselect={handleUserSelect}
              ></c-pe-user-column>
            </div>
          </template>
        </section>

        <!-- Stage 2: Where -->
        <section class={whereSectionClass}>
          <header class={whereHeadClass} onclick={handleStageToggle} onkeydown={handleStageKeyDown} data-stage="app" role="button" aria-expanded={appOpenStr} tabindex="0" title={appToggleTitle}>
            <span class={appBadgeClass} aria-hidden="true">
              <template lwc:if={isAppDone}>
                <svg viewBox="0 0 24 24" class="check_icon" fill="none" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </template>
              <template lwc:else>2</template>
            </span>
            <div class="nav_heading">
              <div class="nav_title_row">
                <span class="nav_title">Where</span>
                <template lwc:if={showEstimateMark}>
                  <span class="nav_mark" title={appEstimateNote}>Estimated</span>
                </template>
              </div>
              <span class="nav_summary" title={appSummary}>{appSummary}</span>
            </div>
            <div class="stage_dropdown_btn" title={appToggleTitle} aria-label={appToggleTitle}>
              <svg class={appChevronClass} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </header>
          <template lwc:if={appOpen}>
            <div class="nav_section_body nav_section_body_compact">
              <c-pe-app-column
                app-list={appList}
                selected-app-id={selectedAppId}
                state={appState}
                error={appError}
                stale-since={resolvedAt}
                onappselect={handleAppSelect}
                onretry={handleAppRetry}
              ></c-pe-app-column>
            </div>
          </template>
        </section>

        <!-- Stage 3: Object / Tab -->
        <section class={objectSectionClass}>
          <header class={objectHeadClass} onclick={handleStageToggle} onkeydown={handleStageKeyDown} data-stage="objects" role="button" aria-expanded={objectsOpenStr} tabindex="0" title={objectToggleTitle}>
            <span class={objectBadgeClass} aria-hidden="true">
              <template lwc:if={isObjectDone}>
                <svg viewBox="0 0 24 24" class="check_icon" fill="none" stroke="currentColor" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
              </template>
              <template lwc:else>3</template>
            </span>
            <div class="nav_heading">
              <span class="nav_title">Object / Tab</span>
              <span class="nav_summary" title={objectSummary}>{objectSummary}</span>
            </div>
            <div class="stage_dropdown_btn" title={objectToggleTitle} aria-label={objectToggleTitle}>
              <svg class={objectChevronClass} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </header>
          <template lwc:if={objectsOpen}>
            <div class="nav_section_body">
              <c-pe-object-list
                app-label={selectedAppLabel}
                rows={objectRows}
                state={railState}
                error={railError}
                selected-api-name={selectedObjectApiName}
                onobjectselect={handleObjectSelect}
                onretry={handleRailRetry}
              ></c-pe-object-list>
            </div>
          </template>
        </section>
      </aside>

      <!-- Inspection workspace -->
      <main class={workspaceClass}>
        <section class="workspace_main">
          <template lwc:if={selectedObjectApiName}>
            <c-pe-what-column
              object-label={selectedObjectLabel}
              object-api-name={selectedObjectApiName}
              tab-visibility={selectedObjectTabVisibility}
              detail={objectDetail}
              state={detailState}
              error={detailError}
              onexplain={handleExplain}
              onretry={handleDetailRetry}
            ></c-pe-what-column>
          </template>
          <template lwc:else>
            <div class="placeholder">
              <div class="placeholder_icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.75">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
              </div>
              <h2 class="phead">{placeholderHeading}</h2>
              <p class="pbody">{placeholderText}</p>
              
              <div class="checklist_card">
                <p class="checklist_title">Access Inspection Steps</p>
                <ol class="placeholder_steps" aria-label="Inspection steps">
                  <li class={whoProgressClass}>
                    <span class="step_badge">1</span>
                    <span class="step_text">Select a user</span>
                  </li>
                  <li class={appProgressClass}>
                    <span class="step_badge">2</span>
                    <span class="step_text">Select an app</span>
                  </li>
                  <li class={objectProgressClass}>
                    <span class="step_badge">3</span>
                    <span class="step_text">Select an object or tab</span>
                  </li>
                </ol>
              </div>
            </div>
          </template>
        </section>

        <template lwc:if={hasWorkspaceContext}>
          <aside class="workspace_context" aria-label="Inspection context">
            <p class="context_label">Context</p>
            <template lwc:if={selectedObjectApiName}>
              <c-pe-granted-by-panel
                detail={objectDetail}
              ></c-pe-granted-by-panel>
            </template>
            <template lwc:if={userSummary}>
              <c-pe-user-summary-header
                summary={userSummary}
                onopenloginhistory={handleOpenLoginHistory}
                onopenpermsets={handleOpenPermSets}
                onopengroups={handleOpenGroups}
              ></c-pe-user-summary-header>
            </template>
          </aside>
        </template>
      </main>
    </div>

    <!-- Modals -->
    <template lwc:if={isTraceModal}>
      <c-pe-modal
        user-name={userSummary.name}
        heading="Access trace"
        onclose={handleTraceClose}
      >
        <c-pe-access-trace
          user-name={userSummary.name}
          app-label={selectedAppLabel}
          object-label={traceLabel}
          object-api-name={traceApiName}
          detail={traceDetail}
          share-link={traceShareLink}
          copied={traceCopied}
          oncopylink={handleCopyTraceLink}
        ></c-pe-access-trace>
      </c-pe-modal>
    </template>

    <template lwc:elseif={isLoginModal}>
      <c-pe-modal
        user-name={userSummary.name}
        heading="Login history"
        onclose={handleModalClose}
      >
        <c-pe-login-history-modal
          result={loginHistory}
          state={loginState}
          error={loginError}
          onretry={handleLoginRetry}
        ></c-pe-login-history-modal>
      </c-pe-modal>
    </template>

    <template lwc:elseif={isPermSetModal}>
      <c-pe-modal
        user-name={userSummary.name}
        heading="Permission sets"
        onclose={handleModalClose}
      >
        <c-pe-user-list-modal
          items={permSetItems}
          state={permSetState}
          error={permSetError}
          empty-headline="No permission sets assigned directly"
          empty-detail="This user's access comes from their profile, or from permission set groups."
          footnote={permSetFootnote}
          onretry={handlePermSetRetry}
        ></c-pe-user-list-modal>
      </c-pe-modal>
    </template>

    <template lwc:elseif={isGroupModal}>
      <c-pe-modal
        user-name={userSummary.name}
        heading="Permission set groups"
        onclose={handleModalClose}
      >
        <c-pe-user-list-modal
          items={groupItems}
          state={groupState}
          error={groupError}
          empty-headline="No permission set groups assigned"
          empty-detail="Permission sets may still be assigned to this user directly."
          footnote={groupFootnote}
          onretry={handleGroupRetry}
        ></c-pe-user-list-modal>
      </c-pe-modal>
    </template>
  </div>
</template>
