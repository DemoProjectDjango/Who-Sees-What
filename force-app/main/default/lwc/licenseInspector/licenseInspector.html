<template>
    <div class="preview-wrapper">
        <section class="license-container">
            <header class="license-header">
                <div class="brand-header-left">
                    <div class="brand-icon-box" aria-hidden="true">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>

                    <div>
                        <div class="brand-eyebrow">
                            <span>WHO SEES WHAT</span>
                            <span class="eyebrow-separator">/</span>
                            <span class="eyebrow-sub">ORG LICENSE INVENTORY</span>
                        </div>
                        <h1 class="header-title">Licenses</h1>
                        <p class="header-subtitle">
                            User, permission set, package and usage-based licenses in this org.
                        </p>
                    </div>
                </div>

                <div class="header-actions">
                    <template lwc:if={lastRefreshedDisplay}>
                        <div class="timestamp-box">
                            <span class="timestamp-label">Last refreshed</span>
                            <span class="timestamp-val">{lastRefreshedDisplay}</span>
                        </div>
                    </template>

                    <button class="btn-refresh" type="button" onclick={handleRefresh}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        Refresh
                    </button>

                    <button class="btn-export" type="button" onclick={handleExport} disabled={exportDisabled}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Export CSV
                    </button>
                </div>
            </header>

            <template lwc:if={hasLicenses}>
                <div class="kpi-row">
                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">LICENSE TYPES</span>
                            <div class="kpi-icon-pill icon-blue" aria-hidden="true">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                                    <polyline points="2 17 12 22 22 17"></polyline>
                                    <polyline points="2 12 12 17 22 12"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="kpi-number">{summary.typesDisplay}</div>
                        <div class="kpi-subtext">
                            <span class="kpi-dot dot-blue"></span>
                            Across all four categories
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">ASSIGNED SEATS</span>
                            <div class="kpi-icon-pill icon-amber" aria-hidden="true">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                        </div>
                        <div class="kpi-number">{summary.seatsDisplay}</div>
                        <div class="kpi-subtext">
                            <span class="kpi-dot dot-amber"></span>
                            Seats currently in use
                        </div>
                    </div>

                    <div class="kpi-card">
                        <div class="kpi-header">
                            <span class="kpi-label">AVAILABLE SEATS</span>
                            <div class="kpi-icon-pill icon-green" aria-hidden="true">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </div>
                        </div>
                        <div class="kpi-number number-green">{summary.freeDisplay}</div>
                        <div class="kpi-subtext">
                            <span class="kpi-dot dot-green"></span>
                            <template lwc:if={summary.hasUnlimited}>
                                Excludes unlimited licenses
                            </template>
                            <template lwc:else>
                                Across all licenses
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <div class="toolbar-wrap">
                <div class="toolbar-filters">
                    <div class="search-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>

                        <input
                            class="search-input"
                            type="search"
                            placeholder="Search licenses or categories..."
                            aria-label="Search licenses"
                            value={searchTerm}
                            oninput={handleSearch}
                        />

                        <template lwc:if={searchTerm}>
                            <button class="search-clear" type="button" title="Clear search" onclick={handleClearSearch}>
                                &times;
                            </button>
                        </template>
                    </div>

                    <select
                        class="filter-status-select"
                        aria-label="Filter licenses by status"
                        value={statusFilter}
                        onchange={handleStatusFilter}>
                        <option value="ALL">All Statuses</option>
                        <option value="IN_USE">In Use (&gt;0 Seats)</option>
                        <option value="AVAILABLE">Available Only</option>
                        <option value="EXHAUSTED">Exhausted (0 Available)</option>
                    </select>
                </div>

                <div class="category-pills" role="tablist" aria-label="Filter by category">
                    <template for:each={quickFilterPills} for:item="p">
                        <button
                            key={p.key}
                            class={p.cls}
                            type="button"
                            data-key={p.key}
                            onclick={handleQuickFilter}>
                            <span>{p.label}</span>
                            <span class="pill-badge">{p.count}</span>
                        </button>
                    </template>
                </div>
            </div>

            <c-pe-state-wrapper
                state={state}
                error={error}
                empty-headline="No licenses found"
                empty-detail="This org has no licenses of any category to inspect."
                skeleton-rows="8"
                onretry={handleRetry}>

                <template lwc:if={isEmptyFiltered}>
                    <div class="empty-filter-state">
                        <p class="empty-headline">No licenses match your filters</p>
                        <p class="empty-detail">Try a different search term, category, or status.</p>
                    </div>
                </template>

                <template lwc:else>
                    <div class="table-wrap">
                        <table class="license-table" aria-label="Licenses">
                            <thead>
                                <tr>
                                    <th class="th-license" scope="col">
                                        <button class={nameSortClass} type="button" data-key="name" onclick={handleSort}>
                                            LICENSE <span class="sort-arrow">{nameSortArrow}</span>
                                        </button>
                                    </th>
                                    <th class="th-category" scope="col">
                                        <button class={categorySortClass} type="button" data-key="category" onclick={handleSort}>
                                            CATEGORY <span class="sort-arrow">{categorySortArrow}</span>
                                        </button>
                                    </th>
                                    <th class="th-used" scope="col">
                                        <button class={usedSortClass} type="button" data-key="used" onclick={handleSort}>
                                            USED / TOTAL <span class="sort-arrow">{usedSortArrow}</span>
                                        </button>
                                    </th>
                                    <th class="th-available" scope="col">
                                        <button class={freeSortClass} type="button" data-key="free" onclick={handleSort}>
                                            AVAILABLE <span class="sort-arrow">{freeSortArrow}</span>
                                        </button>
                                    </th>
                                    <th class="th-users" scope="col">ASSIGNED USERS</th>
                                </tr>
                            </thead>

                            <tbody>
                                <template for:each={pagedRows} for:item="r">
                                    <tr key={r.key}>
                                        <td class="td-license">
                                            <div class="lic-name-box">
                                                <span class="lic-name" title={r.name}>{r.name}</span>
                                                <template lwc:if={r.statusBadgeClass}>
                                                    <span class={r.statusBadgeClass}>{r.orgStatus}</span>
                                                </template>
                                            </div>
                                            <template lwc:if={r.rowMeta}>
                                                <span class="lic-desc" title={r.rowMeta}>{r.rowMeta}</span>
                                            </template>
                                        </td>

                                        <td class="td-category">
                                            <span class={r.typeClass}>{r.typeLabel}</span>
                                        </td>

                                        <td class="td-used">
                                            <div class="used-wrap">
                                                <div class="used-header">
                                                    <div class="used-nums">
                                                        <span class="used-bold">{r.usedDisplay}</span>
                                                        <span class="slash">/</span>
                                                        <span class="used-total">{r.totalDisplay}</span>
                                                    </div>
                                                    <template lwc:if={r.showProgress}>
                                                        <span class="used-pct">{r.pctUsed}%</span>
                                                    </template>
                                                </div>

                                                <template lwc:if={r.showProgress}>
                                                    <div class="bar-track" aria-label={r.progressAriaLabel}>
                                                        <!-- code-analyzer-suppress(pmd:AvoidInlineStyles) Bar width is the per-row usage percentage bound from data; static CSS cannot render it. -->
                                                        <span class={r.barClass} style={r.barStyle}></span>
                                                    </div>
                                                </template>

                                                <template lwc:else>
                                                    <span class="unlimited-label">Unlimited</span>
                                                </template>
                                            </div>
                                        </td>

                                        <td class="td-available">
                                            <span class={r.availableClass}>{r.freeDisplay}</span>
                                        </td>

                                        <td class="td-users">
                                            <template lwc:if={r.showAssignedUsers}>
                                                <div class="assigned-user-list">
                                                    <template for:each={r.assignedUsers} for:item="u">
                                                        <a
                                                            key={u.key}
                                                            class="user-chip-link"
                                                            href={u.url}
                                                            target="_blank"
                                                            rel="noopener noreferrer"
                                                            title={u.username}>
                                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                                                <circle cx="12" cy="7" r="4"></circle>
                                                            </svg>
                                                            <span>{u.name}</span>
                                                        </a>
                                                    </template>
                                                </div>
                                            </template>

                                            <template lwc:else>
                                                <span class={r.assignedUsersClass} title={r.assignedUsersTitle}>
                                                    {r.assignedUsersDisplay}
                                                </span>
                                            </template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <div class="footer-pagination">
                        <div class="pagination-info">{paginationSummary}</div>

                        <div class="pagination-buttons">
                            <button
                                class="pg-btn"
                                type="button"
                                disabled={isFirstPage}
                                onclick={handlePrevPage}
                                aria-label="Previous page">
                                &lsaquo;
                            </button>

                            <template for:each={pageNumbers} for:item="p">
                                <template lwc:if={p.gap}>
                                    <span key={p.key} class="pg-ellipsis">&hellip;</span>
                                </template>

                                <template lwc:else>
                                    <button
                                        key={p.key}
                                        class={p.cls}
                                        type="button"
                                        data-n={p.n}
                                        onclick={handleGoToPage}>
                                        {p.n}
                                    </button>
                                </template>
                            </template>

                            <button
                                class="pg-btn"
                                type="button"
                                disabled={isLastPage}
                                onclick={handleNextPage}
                                aria-label="Next page">
                                &rsaquo;
                            </button>
                        </div>
                    </div>
                </template>
            </c-pe-state-wrapper>
        </section>
    </div>
</template>
