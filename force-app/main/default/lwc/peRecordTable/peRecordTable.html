<template>
    <template lwc:if={loading}>
        <p class="state">Loading records…</p>
    </template>

    <template lwc:elseif={hasRows}>
        <div class="wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">Record</th>
                        <th scope="col" class="col_owner">Owner</th>
                        <template lwc:if={showReason}>
                            <th scope="col" class="col_reason">Reason</th>
                        </template>
                        <th scope="col" class="col_access">Access</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={displayRows} for:item="row">
                        <tr key={row.recordId} class={row.rowClass}>
                            <td class="cell_label" title={row.label}>
                                <a class="record_link" href={row.recordUrl} target="_blank" rel="noopener noreferrer"
                                   title="Open record in a new tab">{row.label}
                                    <lightning-icon class="link_icon" icon-name="utility:new_window" size="xx-small"
                                                    alternative-text="Opens in a new tab"></lightning-icon>
                                </a>
                            </td>
                            <td class="cell_owner">{row.ownerDisplay}</td>
                            <template lwc:if={showReason}>
                                <td class={row.reasonClass} title={row.reasonTitle}>
                                    <span class={row.reasonBadgeClass}>{row.reasonLabel}</span>
                                </td>
                            </template>
                            <td class="cell_access">
                                <span class={row.readClass} title="Read">R</span>
                                <span class={row.editClass} title="Edit">E</span>
                                <span class={row.deleteClass} title={row.deleteTitle}>D</span>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <template lwc:if={hasFlagged}>
            <p class="flag_note">{flaggedNote}</p>
        </template>

        <template lwc:if={hasMore}>
            <div class="more">
                <button class="more_btn" type="button" onclick={handleMore} disabled={loadingMore}>
                    {moreLabel}
                </button>
            </div>
        </template>
    </template>

    <template lwc:else>
        <p class="state">No records to show.</p>
    </template>
</template>
