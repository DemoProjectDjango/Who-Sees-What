<template>
    <div class="field">
        <input class="input"
               type="search"
               role="searchbox"
               placeholder={placeholder}
               aria-label={ariaLabel}
               oninput={handleInput}
               onkeydown={handleKeyDown} />
        <button class={clearClass}
                type="button"
                title="Clear search"
                onclick={handleClear}
                tabindex="-1">&times;</button>
    </div>
</template>
