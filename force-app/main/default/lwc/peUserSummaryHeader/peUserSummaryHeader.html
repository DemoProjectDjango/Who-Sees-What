<template>
    <div class="idcard">
        <div class="idhead">
            <span class="avatar" aria-hidden="true">{initials}</span>
            <div class="idnames">
                <h3 class="name">{summary.name}</h3>
                <p class="role">{roleText}</p>
            </div>
            <span class={statusClass}>{statusLabel}</span>
        </div>

        <p class="sectionlabel">User Identity &amp; Access</p>

        <dl class="facts">
            <template lwc:if={hasEmail}>
                <div class="fact">
                    <dt>Email</dt>
                    <dd class="pe-mono">{emailText}</dd>
                </div>
            </template>
            <template lwc:if={hasDepartment}>
                <div class="fact">
                    <dt>Department</dt>
                    <dd>{departmentText}</dd>
                </div>
            </template>
            <template lwc:if={hasManager}>
                <div class="fact">
                    <dt>Manager</dt>
                    <dd>{managerText}</dd>
                </div>
            </template>
            <div class="fact">
                <dt>Profile</dt>
                <dd>{profileText}</dd>
            </div>
            <div class="fact">
                <dt>License</dt>
                <dd>{licenseText}</dd>
            </div>
            <div class="fact">
                <dt>Last sign-in</dt>
                <dd>
                    {lastLoginText}
                    <button class="probe" type="button"
                            onclick={handleLoginHistory}
                            aria-label={loginHistoryAriaLabel}
                            title="View this user's login history">History</button>
                </dd>
            </div>
        </dl>

        <div class="assigned">
            <div class="assignedrow">
                <span class="assignedlabel">Assigned permission sets ({permSetCount})</span>
                <template lwc:if={hasPermSets}>
                    <button class="probe" type="button"
                            onclick={handlePermSets}
                            aria-label={permSetAriaLabel}>View all</button>
                </template>
            </div>
            <div class="assignedrow">
                <span class="assignedlabel">Permission set groups ({groupCount})</span>
                <template lwc:if={hasGroups}>
                    <button class="probe" type="button"
                            onclick={handleGroups}
                            aria-label={groupAriaLabel}>View all</button>
                </template>
            </div>
        </div>

        <template lwc:if={hasOutdatedGroups}>
            <p class="warn" role="status">
                {outdatedText} still recalculating. Effective permissions may not
                yet match the components, so treat these results as provisional.
            </p>
        </template>

        <template lwc:if={summary.unreadableCount}>
            <p class="warn" role="status">
                {unreadableText} could not be read. Their permissions still apply,
                but the source trace below is incomplete for those grants.
            </p>
        </template>
    </div>
</template>
