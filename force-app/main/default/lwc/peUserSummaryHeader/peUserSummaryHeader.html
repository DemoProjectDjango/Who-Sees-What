<template>
    <div class="summary">
        <div class="identity">
            <h3 class="name">{summary.name}</h3>
            <span class="username pe-mono">{summary.username}</span>
            <template lwc:if={summary.isFrozen}>
                <span class="frozen" title="This user is frozen but still active. Their permissions are unchanged.">Frozen</span>
            </template>
        </div>

        <dl class="facts">
            <div class="fact"><dt>Profile</dt><dd><span class="val">{profileText}</span></dd></div>
            <div class="fact"><dt>Role</dt><dd><span class="val">{roleText}</span></dd></div>
            <div class="fact"><dt>License</dt><dd><span class="val">{licenseText}</span></dd></div>

            <div class="fact">
                <dt>Last sign-in</dt>
                <dd>
                    <span class="val">{lastLoginText}</span>
                    <button class="probe" type="button"
                            onclick={handleLoginHistory}
                            aria-label={loginHistoryAriaLabel}
                            title="View this user's login history">History</button>
                </dd>
            </div>

            <div class="fact">
                <dt>Permission sets</dt>
                <dd>
                    <span class="val">{permSetText}</span>
                    <template lwc:if={hasPermSets}>
                        <button class="probe" type="button"
                                onclick={handlePermSets}
                                aria-label={permSetAriaLabel}
                                title="List the assigned permission sets">View</button>
                    </template>
                </dd>
            </div>

            <div class="fact">
                <dt>Groups</dt>
                <dd>
                    <span class="val">{groupText}</span>
                    <template lwc:if={hasGroups}>
                        <button class="probe" type="button"
                                onclick={handleGroups}
                                aria-label={groupAriaLabel}
                                title="List the assigned permission set groups">View</button>
                    </template>
                </dd>
            </div>
        </dl>

        <template lwc:if={hasOutdatedGroups}>
            <p class="warn" role="status">
                {outdatedText} still recalculating. Effective permissions may not
                yet match the components, so treat these results as provisional.
            </p>
        </template>

        <template lwc:if={summary.unreadableCount}>
            <p class="warn" role="status">
                {unreadableText} could not be read. Their permissions still apply,
                but the source trace below is incomplete for those grants.
            </p>
        </template>
    </div>
</template>
