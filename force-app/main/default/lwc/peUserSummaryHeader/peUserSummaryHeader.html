<template>
    <div class="idcard">
        <div class="idhead">
            <span class="avatar" aria-hidden="true">{initials}</span>
            <div class="idnames">
                <h3 class="name">{summary.name}</h3>
                <p class="role">{roleText}</p>
            </div>
            <span class={statusClass}>{statusLabel}</span>
        </div>

        <p class="sectionlabel">User Identity &amp; Access</p>

        <dl class="facts">
            <template lwc:if={hasEmail}>
                <div class="fact fact-email">
                    <dt>Email</dt>
                    <dd class="email-dd">
                        <span class="email-text" title={emailText}>{emailText}</span>
                        <button class="copy-btn"
                                type="button"
                                onclick={handleCopyEmail}
                                title={copyTitle}
                                aria-label="Copy email address">
                            <template lwc:if={copied}>
                                <svg class="copy-icon copy-icon_success" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <polyline points="20 6 9 17 4 12"></polyline>
                                </svg>
                            </template>
                            <template lwc:else>
                                <svg class="copy-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                            </template>
                        </button>
                    </dd>
                </div>
            </template>
            <template lwc:if={hasDepartment}>
                <div class="fact">
                    <dt>Department</dt>
                    <dd>{departmentText}</dd>
                </div>
            </template>
            <template lwc:if={hasManager}>
                <div class="fact">
                    <dt>Manager</dt>
                    <dd>{managerText}</dd>
                </div>
            </template>
            <div class="fact">
                <dt>Profile</dt>
                <dd>{profileText}</dd>
            </div>
            <div class="fact">
                <dt>License</dt>
                <dd>{licenseText}</dd>
            </div>
            <div class="fact">
                <dt>Last sign-in</dt>
                <dd>
                    {lastLoginText}
                    <button class="probe" type="button"
                            onclick={handleLoginHistory}
                            aria-label={loginHistoryAriaLabel}
                            title="View this user's login history">History</button>
                </dd>
            </div>
        </dl>

        <div class="assigned">
            <div class="assignedrow">
                <span class="assignedlabel">Assigned permission sets ({permSetCount})</span>
                <template lwc:if={hasPermSets}>
                    <button class="probe" type="button"
                            onclick={handlePermSets}
                            aria-label={permSetAriaLabel}>View all</button>
                </template>
            </div>
            <div class="assignedrow">
                <span class="assignedlabel">Permission set groups ({groupCount})</span>
                <template lwc:if={hasGroups}>
                    <button class="probe" type="button"
                            onclick={handleGroups}
                            aria-label={groupAriaLabel}>View all</button>
                </template>
            </div>
        </div>

        <template lwc:if={hasOutdatedGroups}>
            <p class="warn" role="status">
                {outdatedText} still recalculating. Effective permissions may not
                yet match the components, so treat these results as provisional.
            </p>
        </template>

        <template lwc:if={summary.unreadableCount}>
            <p class="warn" role="status">
                {unreadableText} could not be read. Their permissions still apply,
                but the source trace below is incomplete for those grants.
            </p>
        </template>
    </div>
</template>
