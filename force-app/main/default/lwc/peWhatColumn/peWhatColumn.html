<template>
    <section class="what" aria-labelledby="col3-heading">
        <header class="whathead">
            <div class="headrow">
                <div class="ident">
                    <div class="oicon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" class="oicon_svg" fill="none" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                        </svg>
                    </div>
                    <div class="objname">
                        <h2 id="col3-heading" class="olabel">{objectLabel}</h2>
                        <div class="ometa">
                            <span class="meta_item"><span class="meta_label">API:</span> <span class="pe-mono">{objectApiName}</span></span>
                            <span class="meta_sep" aria-hidden="true">&bull;</span>
                            <span class="meta_item"><span class="meta_label">Type:</span> <span class="meta_val">{objectTypeLabel}</span></span>
                        </div>
                    </div>
                </div>

                <div class="viewtools">
                    <div class="vbtn_group" role="group" aria-label="Object view selector">
                        <template for:each={views} for:item="v">
                            <button key={v.key} class={v.class} type="button"
                                    aria-pressed={v.selectedStr} data-key={v.key}
                                    onclick={handleView}>{v.label}</button>
                        </template>
                    </div>
                    <button class="explain slds-button slds-button_brand" type="button" disabled={explainDisabled}
                            onclick={handleExplain}>
                        <svg viewBox="0 0 24 24" class="explain_icon" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                        </svg>
                        <span>Explain this access</span>
                    </button>
                </div>
            </div>

            <template lwc:if={loaded}>
                <div class="badges">
                    <div class="badge">
                        <p class="badge_label">Tab Visibility</p>
                        <span class={tabVisibilityClass}>{tabVisibilityLabel}</span>
                    </div>
                    <div class="badge">
                        <p class="badge_label">Object Access</p>
                        <span class="bpill bpill_on">{objectAccessLabel}</span>
                    </div>
                    <div class="badge">
                        <p class="badge_label">Standard Fields</p>
                        <span class="bpill bpill_on">{standardFieldsLabel}</span>
                    </div>
                    <div class="badge">
                        <p class="badge_label">Custom Fields</p>
                        <span class="bpill bpill_on">{customFieldsLabel}</span>
                    </div>
                    <div class="badge">
                        <p class="badge_label">Record Actions</p>
                        <span class="bpill bpill_on">{recordActionsLabel}</span>
                    </div>
                </div>
            </template>
        </header>

        <div class="whatbody">
            <c-pe-state-wrapper
                state={state}
                error={error}
                empty-headline="Nothing to show"
                empty-detail="This object returned no field or permission data."
                skeleton-rows="8"
                onretry={handleRetry}>

                <template lwc:if={showFields}>
                    <c-pe-field-table fields={detail.fields}></c-pe-field-table>
                </template>

                <template lwc:if={showRecordTypes}>
                    <c-pe-not-analysed
                        headline="Record type access is not analysed"
                        detail="Per-permission-set record type visibility is only available through Profile and PermissionSet metadata, which needs a callout. The list below is what exists on the object, not what this user can see."
                        source="Profile / PermissionSet metadata — recordTypeVisibilities"></c-pe-not-analysed>
                    <template lwc:if={hasRecordTypes}>
                        <div class="rtable">
                            <template for:each={recordTypeRows} for:item="rt">
                                <div key={rt.developerName} class="rt-row">
                                    <span class="rt-label" title={rt.label}>{rt.label}</span>
                                    <span class="rt-api pe-mono" title={rt.developerName}>{rt.developerName}</span>
                                    <span class={rt.stateClass}>{rt.stateText}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
            </c-pe-state-wrapper>
        </div>
    </section>
</template>
