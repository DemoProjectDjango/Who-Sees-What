<template>
    <div class="gs-wrapper">
        <!-- Top Header -->
        <header class="gs-header">
            <div class="brand-left">
                <div class="brand-icon-box" aria-hidden="true">
                    <img src={projectLogo} alt="Who Sees What Logo" class="brand-logo-img" />
                </div>

                <div class="brand-titles">
                    <div class="brand-eyebrow">
                        <span>WHO SEES WHAT</span>
                        <span class="eyebrow-sep">/</span>
                        <span class="eyebrow-sub">ADMINISTRATOR & USER GUIDE</span>
                    </div>
                    <h1 class="header-title">Getting Started</h1>
                </div>
            </div>

            <div class="header-actions">
                <button class="btn btn-secondary" type="button" onclick={handleOpenLicenseInspector}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    License Inspector
                </button>

                <button class="btn btn-primary" type="button" onclick={handleOpenPermExplorer}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Launch Permission Explorer
                </button>
            </div>
        </header>

        <!-- Two Column Layout: Sidebar on Left, Content on Right -->
        <div class="gs-layout">
            <!-- Left Sidebar Navigation -->
            <nav class="gs-sidebar" aria-label="Documentation Topics">
                <div class="sidebar-header">
                    <span class="sidebar-title">GUIDE TOPICS</span>
                    <span class="sidebar-count">{topicCountLabel}</span>
                </div>

                <ul class="sidebar-list">
                    <template for:each={topicList} for:item="t">
                        <li key={t.id}>
                            <button
                                class={t.itemClass}
                                type="button"
                                data-id={t.id}
                                onclick={handleSelectTopic}
                                aria-current={t.ariaCurrent}>
                                <div class="topic-dot-wrap">
                                    <span class="topic-num">{t.num}</span>
                                </div>
                                <div class="topic-info">
                                    <div class="topic-title-row">
                                        <span class="topic-title">{t.title}</span>
                                        <template lwc:if={t.badge}>
                                            <span class={t.badgeClass}>{t.badge}</span>
                                        </template>
                                    </div>
                                    <span class="topic-desc">{t.desc}</span>
                                </div>
                            </button>
                        </li>
                    </template>
                </ul>
            </nav>

            <!-- Right Content Panel -->
            <main class="gs-content" role="region" aria-live="polite">
                <!-- ========================================================
                     TOPIC 1: INITIAL SETUP CHECKLIST (DEFAULT)
                     ======================================================== -->
                <template lwc:if={isSetupTopic}>
                    <article class="content-pane">
                        <div class="content-header">
                            <div class="topic-eyebrow">STEP-BY-STEP ONBOARDING</div>
                            <h2 class="content-title">Initial Setup Checklist</h2>
                            <p class="content-subtitle">
                                Complete these two administrative steps to enable access and begin inspecting user permissions across your org.
                            </p>
                        </div>

                        <!-- Step 1 Detail -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 1</span>
                                <span class="card-step-badge badge-orange">Required</span>
                            </div>
                            <h3 class="card-h3">Assign the Administrator Permission Set</h3>
                            <p class="card-p">
                                Assign the <code class="inline-code">PermissionCheckerPermissionSet</code> to System Administrators and Security Auditors who need to inspect user permissions.
                            </p>

                            <!-- Copy Code Box -->
                            <div class="code-action-box">
                                <div class="code-display">
                                    <span class="code-val">PermissionCheckerPermissionSet</span>
                                </div>
                                <button class="btn-copy-code" type="button" onclick={handleCopyPermSet} title="Copy permission set name">
                                    <template lwc:if={copied}>
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <polyline points="20 6 9 17 4 12"></polyline>
                                        </svg>
                                        <span>Copied!</span>
                                    </template>
                                    <template lwc:else>
                                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                        </svg>
                                        <span>Copy API Name</span>
                                    </template>
                                </button>
                            </div>

                            <div class="step-nav-actions">
                                <button class="btn-setup-link" type="button" onclick={handleOpenPermSetsSetup}>
                                    Open Setup &rarr; Permission Sets
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <line x1="7" y1="17" x2="17" y2="7"></line>
                                        <polyline points="7 7 17 7 17 17"></polyline>
                                    </svg>
                                </button>
                            </div>

                            <div class="callout callout-info">
                                <strong class="callout-title">Why is assignment deliberate and manual?</strong>
                                <p class="callout-text">
                                    Because this permission set grants the ability to audit every user's effective permissions, it should be an explicit administrative choice rather than an automatic default. It belongs strictly with administrators who oversee org security.
                                </p>
                            </div>
                        </div>

                        <!-- Step 2 Detail -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 2</span>
                                <span class="card-step-badge badge-blue">Profile Configuration</span>
                            </div>
                            <h3 class="card-h3">Verify App Visibility for Profiles</h3>
                            <p class="card-p">
                                Check the App Launcher for <strong>Who Sees What</strong>. If the app is not visible to your profile, enable it in Setup.
                            </p>

                            <div class="path-box">
                                <span class="path-title">Navigation Path:</span>
                                <div class="path-flow">
                                    <span class="path-node">Setup</span>
                                    <span class="path-sep">&rarr;</span>
                                    <span class="path-node">Profiles</span>
                                    <span class="path-sep">&rarr;</span>
                                    <span class="path-node">Your Profile</span>
                                    <span class="path-sep">&rarr;</span>
                                    <span class="path-node">Assigned Apps</span>
                                    <span class="path-sep">&rarr;</span>
                                    <span class="path-node path-highlight">Enable "Who Sees What"</span>
                                </div>
                            </div>

                            <div class="step-nav-actions">
                                <button class="btn-setup-link" type="button" onclick={handleOpenProfilesSetup}>
                                    Open Setup &rarr; Profiles
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <line x1="7" y1="17" x2="17" y2="7"></line>
                                        <polyline points="7 7 17 7 17 17"></polyline>
                                    </svg>
                                </button>
                                <button class="btn-setup-link" type="button" onclick={handleOpenAppManager}>
                                    Open App Manager
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                        <line x1="7" y1="17" x2="17" y2="7"></line>
                                        <polyline points="7 7 17 7 17 17"></polyline>
                                    </svg>
                                </button>
                            </div>

                            <div class="callout callout-neutral">
                                <strong class="callout-title">Platform Constraint:</strong>
                                <p class="callout-text">
                                    In Salesforce, Lightning App assignments are stored in profile and app metadata, so app visibility cannot be assigned through a standard permission set.
                                </p>
                            </div>
                        </div>

                        <!-- Step 3 Detail -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 3</span>
                                <span class="card-step-badge badge-green">Ready to Use</span>
                            </div>
                            <h3 class="card-h3">Start Exploring Permissions & Licenses</h3>
                            <p class="card-p">
                                You are all set! Open <strong>Permission Explorer</strong> to inspect specific users and objects, or open <strong>License Inspector</strong> to analyze license capacity.
                            </p>

                            <div class="action-tiles-grid">
                                <div class="action-tile" onclick={handleOpenPermExplorer} role="button" tabindex="0">
                                    <div class="action-tile-icon at-blue" aria-hidden="true">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                    </div>
                                    <div class="action-tile-body">
                                        <span class="at-title">Permission Explorer</span>
                                        <span class="at-sub">Inspect user access, apps, CRUD, and access traces.</span>
                                    </div>
                                    <span class="at-link">Launch &rarr;</span>
                                </div>

                                <div class="action-tile" onclick={handleOpenLicenseInspector} role="button" tabindex="0">
                                    <div class="action-tile-icon at-green" aria-hidden="true">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                                        </svg>
                                    </div>
                                    <div class="action-tile-body">
                                        <span class="at-title">License Inspector</span>
                                        <span class="at-sub">Review user, permission set, and package licenses.</span>
                                    </div>
                                    <span class="at-link">Launch &rarr;</span>
                                </div>
                            </div>
                        </div>

                        <!-- Next Topic Prompt -->
                        <div class="pane-footer-nav">
                            <span class="pfn-label">Next in guide:</span>
                            <button class="pfn-btn" type="button" data-id="explorer" onclick={handleSelectTopic}>
                                2. Permission Explorer Guide &rarr;
                            </button>
                        </div>
                    </article>
                </template>

                <!-- ========================================================
                     TOPIC 2: PERMISSION EXPLORER GUIDE
                     ======================================================== -->
                <template lwc:if={isExplorerTopic}>
                    <article class="content-pane">
                        <div class="content-header">
                            <div class="topic-eyebrow">STEP-BY-STEP VISUAL GUIDE</div>
                            <h2 class="content-title">Permission Explorer Guide</h2>
                            <p class="content-subtitle">
                                Follow these 4 essential steps in Permission Explorer to select any user, scope applications, choose objects or tabs, and inspect effective CRUD, Field-Level Security (FLS), and exact permission sources.
                            </p>
                        </div>

                        <!-- Step 1: Select or Search User -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 1</span>
                                <span class="card-step-badge badge-blue">User &amp; Profile Selection</span>
                            </div>
                            <h3 class="card-h3">1. Select or Search the User or Profile</h3>

                            <!-- Screenshot Step 1 -->
                            <div class="hiw-screenshot-card" onclick={handleOpenPreview} data-step="1" role="button" tabindex="0" title="Click to view full resolution screenshot">
                                <div class="hiw-screenshot-header">
                                    <span class="hiw-screenshot-label">Step 1 Screenshot</span>
                                    <span class="hiw-zoom-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                        </svg>
                                        Click to Enlarge
                                    </span>
                                </div>
                                <div class="hiw-screenshot-img-box">
                                    <img src={step1Img} alt="Step 1: Select or Search the User or Profile" class="hiw-step-img" />
                                </div>
                            </div>

                            <!-- What you will do in Step 1 -->
                            <div class="step-guide-box">
                                <h4 class="step-guide-heading">What you will do in this step:</h4>
                                <ul class="step-guide-list">
                                    <li><strong>Search any user:</strong> Type in the search box to find users instantly by display name, username, email, or profile.</li>
                                    <li><strong>Filter &amp; sort:</strong> Filter users by assigned Profile, Role, or Active status to quickly find the user to audit.</li>
                                    <li><strong>Select target user:</strong> Click on any user card to immediately load their identity and permissions into the audit view.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Step 2: Select the Application -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 2</span>
                                <span class="card-step-badge badge-blue">App Scope Filtering</span>
                            </div>
                            <h3 class="card-h3">2. Select the Application</h3>

                            <!-- Screenshot Step 2 -->
                            <div class="hiw-screenshot-card" onclick={handleOpenPreview} data-step="2" role="button" tabindex="0" title="Click to view full resolution screenshot">
                                <div class="hiw-screenshot-header">
                                    <span class="hiw-screenshot-label">Step 2 Screenshot</span>
                                    <span class="hiw-zoom-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                        </svg>
                                        Click to Enlarge
                                    </span>
                                </div>
                                <div class="hiw-screenshot-img-box">
                                    <img src={step2Img} alt="Step 2: Select the Application" class="hiw-step-img" />
                                </div>
                            </div>

                            <!-- What you will do in Step 2 -->
                            <div class="step-guide-box">
                                <h4 class="step-guide-heading">What you will do in this step:</h4>
                                <ul class="step-guide-list">
                                    <li><strong>Filter by application:</strong> Select any Salesforce app (e.g. Sales, Service, or custom Lightning app) to scope the view strictly to objects in that app.</li>
                                    <li><strong>Audit org-wide objects:</strong> Choose <em>All Objects</em> to view and audit permissions across all standard and custom Salesforce objects in your org.</li>
                                    <li><strong>Review tab counts:</strong> See the number of standard and custom navigation tabs configured for each app.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Step 3: Choose the Object or Tab -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 3</span>
                                <span class="card-step-badge badge-blue">Entity Exploration</span>
                            </div>
                            <h3 class="card-h3">3. Choose the Object or Tab</h3>

                            <!-- Screenshot Step 3 -->
                            <div class="hiw-screenshot-card" onclick={handleOpenPreview} data-step="3" role="button" tabindex="0" title="Click to view full resolution screenshot">
                                <div class="hiw-screenshot-header">
                                    <span class="hiw-screenshot-label">Step 3 Screenshot</span>
                                    <span class="hiw-zoom-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                        </svg>
                                        Click to Enlarge
                                    </span>
                                </div>
                                <div class="hiw-screenshot-img-box">
                                    <img src={step3Img} alt="Step 3: Choose the Object or Tab" class="hiw-step-img" />
                                </div>
                            </div>

                            <!-- What you will do in Step 3 -->
                            <div class="step-guide-box">
                                <h4 class="step-guide-heading">What you will do in this step:</h4>
                                <ul class="step-guide-list">
                                    <li><strong>Search objects &amp; tabs:</strong> Quickly locate any standard or custom object by typing its label or API name.</li>
                                    <li><strong>Instant CRUD glance:</strong> Check color-coded badges (C, R, E, D, V, M) on each row to verify Create, Read, Edit, Delete, View All, and Modify All access at a glance.</li>
                                    <li><strong>Select object to audit:</strong> Click on any object row to load its complete permissions matrix and field security in the right panel.</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Step 4: View Permissions, Field-Level Security & Access Sources -->
                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Step 4</span>
                                <span class="card-step-badge badge-green">Permissions Matrix &amp; Audit</span>
                            </div>
                            <h3 class="card-h3">4. View Permissions, Field-Level Security &amp; Access Sources</h3>

                            <!-- Screenshot Step 4 -->
                            <div class="hiw-screenshot-card" onclick={handleOpenPreview} data-step="4" role="button" tabindex="0" title="Click to view full resolution screenshot">
                                <div class="hiw-screenshot-header">
                                    <span class="hiw-screenshot-label">Step 4 Screenshot</span>
                                    <span class="hiw-zoom-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                        </svg>
                                        Click to Enlarge
                                    </span>
                                </div>
                                <div class="hiw-screenshot-img-box">
                                    <img src={step4Img} alt="Step 4: View Permissions, Field-Level Security & Access Sources" class="hiw-step-img" />
                                </div>
                            </div>

                            <!-- What you will do in Step 4 -->
                            <div class="step-guide-box">
                                <h4 class="step-guide-heading">What you will do in this step:</h4>
                                <ul class="step-guide-list">
                                    <li><strong>Review object CRUD:</strong> View clear status pills for Create, Read, Edit, Delete, View All, and Modify All permissions.</li>
                                    <li><strong>Audit Field-Level Security (FLS):</strong> Check every standard and custom field for Readable and Editable status, with filters for Read-Only, Editable, or Hidden fields.</li>
                                    <li><strong>Trace access sources:</strong> Discover the exact Profile, Permission Set, or Group granting each right using inline source chips.</li>
                                    <li><strong>Deep diagnostic trace:</strong> Click <em>"Explain this access"</em> to open the Access Trace modal explaining profile vs. group vs. muting calculations.</li>
                                </ul>
                            </div>

                            <!-- code-analyzer-suppress(pmd:AvoidInlineStyles) -->
                            <div class="step-nav-actions" style="margin-top: 1.5rem;">
                                <button class="btn btn-primary" type="button" onclick={handleOpenPermExplorer}>
                                    Open Permission Explorer
                                </button>
                                <button class="btn btn-secondary" type="button" onclick={handleOpenLicenseInspector}>
                                    Open License Inspector
                                </button>
                            </div>
                            <!-- code-analyzer-unsuppress(pmd:AvoidInlineStyles) -->
                        </div>

                        <!-- Next Topic Prompt -->
                        <div class="pane-footer-nav">
                            <span class="pfn-label">Next in guide:</span>
                            <button class="pfn-btn" type="button" data-id="licenses" onclick={handleSelectTopic}>
                                3. License Inspector &amp; Seat Management &rarr;
                            </button>
                        </div>
                    </article>
                </template>

                <!-- ========================================================
                     TOPIC 3: LICENSE INSPECTOR
                     ======================================================== -->
                <template lwc:if={isLicensesTopic}>
                    <article class="content-pane">
                        <div class="content-header">
                            <div class="topic-eyebrow">CAPACITY MANAGEMENT &amp; AUDIT</div>
                            <h2 class="content-title">License Inspector Guide</h2>
                            <p class="content-subtitle">
                                Monitor seat allocation, track active user assignments, analyze package usage, and export audit-ready license reports in real time.
                            </p>
                        </div>

                        <div class="content-card">
                            <div class="card-step-header">
                                <span class="card-step-num">Overview</span>
                                <span class="card-step-badge badge-green">Org License Inventory</span>
                            </div>
                            <h3 class="card-h3">How License Inspector Works</h3>

                            <!-- Screenshot License Inspector -->
                            <div class="hiw-screenshot-card" onclick={handleOpenPreview} data-step="licenses" role="button" tabindex="0" title="Click to view full resolution screenshot">
                                <div class="hiw-screenshot-header">
                                    <span class="hiw-screenshot-label">License Inspector Interface Preview</span>
                                    <span class="hiw-zoom-badge">
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                                            <circle cx="11" cy="11" r="8"></circle>
                                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                            <line x1="11" y1="8" x2="11" y2="14"></line>
                                            <line x1="8" y1="11" x2="14" y2="11"></line>
                                        </svg>
                                        Click to Enlarge
                                    </span>
                                </div>
                                <div class="hiw-screenshot-img-box">
                                    <img src={licInspectorImg} alt="License Inspector: Real-Time Org License Inventory" class="hiw-step-img" />
                                </div>
                            </div>

                            <!-- What this screen does & How it works -->
                            <div class="step-guide-box">
                                <h4 class="step-guide-heading">What this screen does &amp; how it works:</h4>
                                <ul class="step-guide-list">
                                    <li><strong>Real-time KPI summary cards:</strong> View org-wide counters for total distinct <em>License Types</em>, currently <em>Assigned Seats</em> in active use, and remaining <em>Available Seats</em>.</li>
                                    <li><strong>4 core license categories:</strong> Filter immediately across <em>User Licenses</em>, <em>Permission Set Licenses</em>, <em>Package Licenses</em>, and <em>Usage Entitlements</em> (API request limits, storefronts, credits).</li>
                                    <li><strong>Search &amp; status filtering:</strong> Rapidly search licenses or categories by keyword, or filter by status to isolate active vs. depleted allocations.</li>
                                    <li><strong>Live seat utilization gauges:</strong> Check <em>Used / Total</em> counts alongside visual progress bars and percentage meters to catch capacity limits early.</li>
                                    <li><strong>Assigned user inspection:</strong> Click on any license row to view direct drill-down links to the specific users assigned to each license seat.</li>
                                    <li><strong>Refresh &amp; Export CSV:</strong> Click <em>Refresh</em> to sync real-time data with Salesforce licensing, or click <em>Export CSV</em> to generate instant audit spreadsheets.</li>
                                </ul>
                            </div>

                            <!-- code-analyzer-suppress(pmd:AvoidInlineStyles) -->
                            <div class="step-nav-actions" style="margin-top: 1.5rem;">
                                <button class="btn btn-primary" type="button" onclick={handleOpenLicenseInspector}>
                                    Open License Inspector
                                </button>
                                <button class="btn btn-secondary" type="button" onclick={handleOpenPermExplorer}>
                                    Open Permission Explorer
                                </button>
                            </div>
                            <!-- code-analyzer-unsuppress(pmd:AvoidInlineStyles) -->
                        </div>

                        <!-- Next Topic Prompt -->
                        <div class="pane-footer-nav">
                            <span class="pfn-label">Next in guide:</span>
                            <button class="pfn-btn" type="button" data-id="contact" onclick={handleSelectTopic}>
                                4. Contact Info &amp; Support &rarr;
                            </button>
                        </div>
                    </article>
                </template>

                <!-- ========================================================
                     TOPIC 4: CONTACT INFO & SUPPORT
                     ======================================================== -->
                <template lwc:if={isContactTopic}>
                    <article class="content-pane">
                        <div class="content-header">

    <!-- Screenshot Full Size Lightbox Modal -->
    <template lwc:if={previewModalOpen}>

        <section class="hiw-lightbox-modal" role="dialog" aria-modal="true" aria-label={previewImgTitle}>
            <div class="hiw-lightbox-header">
                <span class="hiw-lightbox-title">{previewImgTitle}</span>
                <button class="hiw-lightbox-close" type="button" onclick={handleClosePreview} title="Close full size view">
                    &times;
                </button>
            </div>
            <div class="hiw-lightbox-body">
                <img src={previewImgSrc} alt={previewImgTitle} class="hiw-lightbox-img" />

        </section>
