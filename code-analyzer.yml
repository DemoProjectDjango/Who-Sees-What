# Apex and Salesforce metadata remain available to PMD.
# PMD JavaScript analysis is disabled because its ECMAScript rules produce
# false positives against modern LWC patterns. LWC JavaScript is linted using
# the project's Salesforce LWC ESLint configuration via npm run lint.

engines:
  pmd:
    file_extensions:
      apex:
        - .cls
        - .trigger
      javascript: []
      typescript: []

  eslint:
    disable_engine: true
  
  sfge:
    java_thread_timeout: 300000

suppressions:
  disable_suppressions: false